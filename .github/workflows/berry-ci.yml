name: Berry validation

on:
  push:
    branches:
      - Jaccie-Jay
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run mastery and utility tests
        run: npm test
      - name: Type-check
        run: npm run lint
      - name: Build application
        run: npm run build

  deploy-firestore-rules:
    name: Deploy Firestore security rules
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/Jaccie-Jay'
    runs-on: ubuntu-latest
    steps:
      - name: Check Firebase deployment configuration
        id: firebase_config
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          service_account="${FIREBASE_SERVICE_ACCOUNT_JSON:-${FIREBASE_SERVICE_ACCOUNT:-}}"
          project_id="${FIREBASE_PROJECT_ID:-${VITE_FIREBASE_PROJECT_ID:-}}"
          if [ -n "$service_account" ] && [ -n "$project_id" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Firebase deployment credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Firestore rules deployment skipped: configure FIREBASE_SERVICE_ACCOUNT_JSON (or FIREBASE_SERVICE_ACCOUNT) and FIREBASE_PROJECT_ID (or VITE_FIREBASE_PROJECT_ID) in repository Actions secrets."
          fi

      - name: Check out repository
        if: steps.firebase_config.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.firebase_config.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Firestore security rules
        if: steps.firebase_config.outputs.configured == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          service_account="${FIREBASE_SERVICE_ACCOUNT_JSON:-${FIREBASE_SERVICE_ACCOUNT:-}}"
          project_id="${FIREBASE_PROJECT_ID:-${VITE_FIREBASE_PROJECT_ID:-}}"
          credentials_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$service_account" > "$credentials_file"
          chmod 600 "$credentials_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials_file"
          npx --yes firebase-tools@latest deploy --only firestore:rules --project "$project_id" --non-interactive

      - name: Explain deployment status
        if: always() && steps.firebase_config.outputs.configured != 'true'
        run: |
          {
            echo "### Firestore rules deployment not performed"
            echo ""
            echo "Validation can pass, but live Firestore rules were not deployed because Firebase deployment secrets are not configured."
            echo "Add FIREBASE_SERVICE_ACCOUNT_JSON (service-account JSON) and FIREBASE_PROJECT_ID (Firebase project ID) in repository Settings → Secrets and variables → Actions, then rerun this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
