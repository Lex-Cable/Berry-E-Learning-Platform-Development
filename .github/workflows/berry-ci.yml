name: Berry validation

on:
  push:
    branches:
      - security/trusted-assessment-backend
  pull_request:
    branches:
      - security/trusted-assessment-backend

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Type-check
        run: npm run lint
      - name: Build application
        run: npm run build

# Firestore rules deployment is intentionally excluded. Production deployment
# requires a separate, explicit approval after security review and staging tests.
