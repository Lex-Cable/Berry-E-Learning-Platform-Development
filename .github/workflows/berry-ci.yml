name: Berry validation

on:
  push:
    branches: [master, Jaccie-Jay]
  pull_request:
    branches: [master, Jaccie-Jay]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Type-check
        run: npm run lint
      - name: Build application
        run: npm run build

  firestore-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Firestore security rules tests
        run: npm run test:rules
      - name: Trusted certificate issuance tests
        run: npm run test:certificates

# Production deployment and Firestore rules publication require separate approval.
